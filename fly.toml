# fly.toml app configuration file generated for alle-drops-quiz-app on 2025-12-01T06:45:52-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'alle-drops-quiz-app'
primary_region = 'iad'

[build]

[env]
  PORT = '3000'
  SCOPES = 'read_customers,write_customers'
  SHOPIFY_APP_URL = 'https://alle-drops-quiz-app.fly.dev'
  # Note: SHOPIFY_API_KEY is set as a secret (not in env section for security)

[processes]
  app = 'node ./dbsetup.js npm run docker-start'

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

# Health check configuration
# This helps Fly.io detect when the app is ready and keeps it warm
[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1

# Memory raised 1gb -> 2gb (plan 04-17, single attributable change — cpus/cpu_kind deliberately
# left alone so a later regression is unambiguous). Reason: this process now streams binary PHI,
# decodes HEIC, re-encodes JPEG, and merges PDFs in-process (plans 04-13/04-15), on top of the
# existing Shopify session traffic and a `max: 5` Cloud SQL pool (app/lib/db.ts). Worst-case
# per-request memory is bounded by the ratified caps in 04-UPLOAD-DECISIONS.md:
# MAX_FILE_BYTES = 15 MB, MAX_TOTAL_BYTES = 50 MB (app/lib/storage/upload-validation.ts).
# OOM behaviour under realistic load (a handful of concurrent patients, each uploading up to
# ~4 photos) is actually observed during plan 04-19's human pass — watch `fly logs -a
# alle-drops-quiz-app` for OOM kills during that pass. If OOM still occurs at 2gb, the
# pre-decided next lever is `cpus = 2` (NOT the more complex direct-to-GCS architecture — that
# ordering was decided at plan 04-10, 04-RESEARCH.md Pitfall 4 / Open Question 3).
